name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Annule les exécutions précédentes sur la même branche : inutile de payer
# trois fois la même analyse pendant une série de commits.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Version figée. Sans cela, `channel: stable` fait dériver la CI à chaque
  # publication Flutter et une build verte peut virer au rouge sans commit.
  FLUTTER_VERSION: "3.47.3"

jobs:
  quality:
    name: Lint, analyse et tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Dépendances
        run: flutter pub get

      - name: Génération des traductions
        # Rejoue gen-l10n avant tout le reste : l'analyse et les tests
        # travaillent ainsi sur la sortie réelle de l'outil, pas sur une
        # version potentiellement obsolète du dépôt. Les fichiers restent
        # versionnés pour qu'un clone neuf compile sans cette étape.
        run: flutter gen-l10n

      - name: Format
        # Bloquant (plus de continue-on-error). `lib/l10n/` est exclu : ces
        # fichiers sont générés, leur mise en forme appartient à l'outil.
        run: |
          FILES=$(git ls-files '*.dart' | grep -v '^lib/l10n/' || true)
          if [ -n "$FILES" ]; then
            dart format --output=none --set-exit-if-changed $FILES
          fi

      - name: Analyse statique
        # `flutter analyze` sort déjà en code non nul dès la première
        # remarque, y compris les `info` produites par les règles de
        # `analysis_options.yaml` : aucun drapeau supplémentaire n'est requis.
        run: flutter analyze

      - name: Tests unitaires et de widgets
        run: flutter test --coverage --reporter=expanded

      - name: Tests d'intégration
        # `flutter test integration_test` les exécute dans la VM
        # `flutter_tester`, sans émulateur : pas d'appareil à provisionner.
        run: flutter test integration_test --reporter=expanded

      - name: Rapport de couverture
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: warn

  build-apk:
    name: APK de démonstration
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Dépendances
        run: flutter pub get

      - name: Configuration d'exemple
        # Le vrai `env.json` n'est pas versionné (il contient l'URL du projet
        # Supabase). L'APK de démonstration est construit avec le gabarit :
        # il se lance et affiche l'écran de connexion, sans backend joignable.
        run: cp env.example.json env.ci.json

      - name: Build APK release
        run: flutter build apk --release --dart-define-from-file=env.ci.json

      - uses: actions/upload-artifact@v4
        with:
          name: cine-club-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
