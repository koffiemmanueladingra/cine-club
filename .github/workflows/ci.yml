name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.3"

jobs:
  quality:
    name: Lint, analyse et tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Dépendances
        run: flutter pub get

      - name: Génération des traductions

        run: flutter gen-l10n

      - name: Format
        run: |
          FILES=$(git ls-files '*.dart' | grep -v '^lib/l10n/' || true)
          if [ -n "$FILES" ]; then
            dart format --output=none --set-exit-if-changed $FILES
          fi

      - name: Analyse statique

        run: flutter analyze

      - name: Tests unitaires et de widgets
        run: flutter test --coverage --reporter=expanded

            - name: Dépendances système pour Linux desktop
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev xvfb \
            libsecret-1-dev libjsoncpp-dev

      - name: Tests d'intégration

        run: |
          flutter config --enable-linux-desktop
          xvfb-run -a flutter test integration_test -d linux --reporter=expanded

      - name: Rapport de couverture
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: warn

  build-apk:
    name: APK de démonstration
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Dépendances
        run: flutter pub get

      - name: Configuration d'exemple

        run: cp env.example.json env.ci.json

      - name: Build APK release
        run: flutter build apk --release --dart-define-from-file=env.ci.json

      - uses: actions/upload-artifact@v4
        with:
          name: cine-club-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
