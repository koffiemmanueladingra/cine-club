name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Dépendances
        run: flutter pub get

      - name: Format
        continue-on-error: true
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyse statique
        run: flutter analyze

      - name: Tests unitaires
        run: flutter test
