name: cine_club
description: >-
  CinéClub — application Flutter full-stack connectée à un backend Supabase
  (API REST PostgREST + Auth JWT), avec cache local Hive CE et mode hors-ligne.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  dio: ^5.4.0

  hive_ce: ^2.8.0
  hive_ce_flutter: ^2.3.4

  flutter_secure_storage: ^9.0.0

  connectivity_plus: ^6.0.0

  provider: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.0
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
